name: Build

# DayLight Creative Technologies fork. SocialScoreKeeper pins this fork by commit SHA, and its
# `scripts/check_fork_ci_green.py` (gate #76) requires the pinned commit to have a green run of this
# workflow in which the job named "XCTest (iOS)" succeeded. Renaming that job breaks the gate, by design.
#
# A push to the default branch starts a run. GitHub keeps a fork's workflows dormant until Actions is
# enabled for it, so a run can also be dispatched by hand:
#   gh workflow run build.yml --repo DayLight-Creative-Technologies/dlct_mixpanel_swift --ref dlct-7.1.0

on:
  push:
    branches: [ dlct-7.1.0 ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xctest-ios:
    name: XCTest (iOS)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
    - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1
      with:
        xcode-version: '26'

    # The fork's change, with no test retries: these tests guard children's privacy, so a flaky pass must
    # not hide a real failure. MixpanelOptOutPurgeTests is the new suite; MixpanelOptOutTests holds the
    # existing opt-out behaviour (three of its tests were updated for the purge).
    - name: Opt-out tests (iOS Simulator)
      working-directory: MixpanelDemo
      run: |
        set -o pipefail
        NSUnbufferedIO=YES xcodebuild \
          -scheme MixpanelDemo \
          -derivedDataPath Build/ \
          -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" \
          -configuration Debug \
          -only-testing:MixpanelDemoTests/MixpanelOptOutPurgeTests \
          -only-testing:MixpanelDemoTests/MixpanelOptOutTests \
          -resultBundlePath "$RUNNER_TEMP/optout.xcresult" \
          ONLY_ACTIVE_ARCH=NO \
          ENABLE_TESTABILITY=YES \
          clean build test | xcbeautify --renderer github-actions

    # xcodebuild exits 0 when an -only-testing selector matches nothing (a renamed or deleted class), so a
    # green step above does not show the tests ran. Fail unless both classes executed tests and none failed
    # or was skipped.
    - name: Opt-out tests ran (not zero)
      run: |
        python3 .github/scripts/assert_tests_ran.py "$RUNNER_TEMP/optout.xcresult" \
          MixpanelOptOutPurgeTests MixpanelOptOutTests

    # The whole upstream iOS suite, for visibility only (continue-on-error). Timing-sensitive upstream
    # tests (the feature-flag latency bound, instrumented SwiftUI UI tests, the logger test) fail
    # intermittently on hosted runners, with or without upstream's retries (two runs of this fork, 4 and 6
    # failures, none in the opt-out tests), so the step shows what failed without turning the job red.
    - name: Full iOS suite (informational)
      continue-on-error: true
      working-directory: MixpanelDemo
      run: |
        set -o pipefail
        NSUnbufferedIO=YES xcodebuild \
          -scheme MixpanelDemo \
          -derivedDataPath Build/ \
          -destination "platform=iOS Simulator,name=iPhone 17 Pro,OS=latest" \
          -configuration Debug \
          -retry-tests-on-failure -test-iterations 3 \
          ONLY_ACTIVE_ARCH=NO \
          ENABLE_TESTABILITY=YES \
          test | xcbeautify --renderer github-actions
